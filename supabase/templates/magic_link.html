<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#171412">
  <h2 style="margin:0 0 12px">Accesso ai lead del quiz</h2>
  <p style="margin:0 0 20px;line-height:1.5">Clicca il pulsante per entrare. Il link vale poco tempo e si usa una volta sola.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/quiz-leads/?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#780000;color:#fff;text-decoration:none;padding:14px 22px;border-radius:6px;font-weight:bold">Entra nei lead</a>
  </p>
  <p style="margin:0 0 8px;line-height:1.5">Se il link non si apre (per esempio dal telefono), inserisci questo codice nella pagina di accesso:</p>
  <p style="margin:0 0 24px;font-size:28px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
  <p style="margin:0;font-size:13px;color:#666">Se non hai chiesto tu questo accesso, ignora questa email.</p>
</div>

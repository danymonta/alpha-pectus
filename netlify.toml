# Deploy alternativo su Netlify (spec J.3, D37, G.4). Host principale: Cloudflare Pages.
# Header e link brevi stanno in public/_headers e public/_redirects, letti da entrambe le piattaforme:
# non ripeterli qui. Qui restano solo le cose che esistono solo su Netlify.

[build]
  # La build si ferma se il controllo del copy trova un problema (spec F.10, J.4 punto 8).
  command = "npm run build && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La cartella functions/ in radice è di Cloudflare Pages: Netlify non deve toccarla.
[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# 1. Dominio netlify.app verso il dominio vero (301).
# Da attivare dopo aver collegato pectus.percorsoalpha.com: sostituisci NOME-SITO con il nome del sito
# su Netlify (Site configuration > Site details > Site name), poi togli il cancelletto dalle 5 righe.
# Lascialo spento finché il dominio non risponde in HTTPS, altrimenti il sito diventa irraggiungibile.
# ---------------------------------------------------------------------------
# [[redirects]]
#   from = "https://NOME-SITO.netlify.app/*"
#   to = "https://pectus.percorsoalpha.com/:splat"
#   status = 301
#   force = true

# ---------------------------------------------------------------------------
# 2. Analytics senza cookie: eventi Plausible (server UE) dal nostro dominio (rewrite 200).
# Su Cloudflare Pages lo stesso percorso lo serve functions/pa/api/event.js.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/pa/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# 3. Edge function: /?v=<variante> serve la pagina statica /v/<variante>/ (spec D3, J.2).
# Su Cloudflare Pages lo fa functions/index.js.
# ---------------------------------------------------------------------------
[[edge_functions]]
  path = "/"
  function = "hero-variant"
